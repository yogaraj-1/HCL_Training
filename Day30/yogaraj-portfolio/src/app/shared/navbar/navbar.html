<header class="navbar">
  <nav class="navbar__inner" aria-label="Main navigation">
    <a class="navbar__brand" routerLink="/home" (click)="closeMenu()">{{ brand }}</a>

    <button
      type="button"
      class="navbar__toggle"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="isMenuOpen"
      (click)="toggleMenu()">
      {{ isMenuOpen ? '✕' : '☰' }}
    </button>

    <ul class="navbar__links" [class.open]="isMenuOpen">
      @for (item of navItems; track item.path) {
        <li>
          <a [routerLink]="item.path" routerLinkActive="active" (click)="closeMenu()">
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>
</header>
