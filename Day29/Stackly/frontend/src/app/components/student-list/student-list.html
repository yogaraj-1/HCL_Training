<div class="student-list-container">

  <h2>Student Management</h2>

  @if (students.length > 0) {

    <table>

      <thead>
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>Email</th>
          <th>Course</th>
          <th>Price</th>
          <th>Registration Date</th>
        </tr>
      </thead>

      <tbody>

        @for (student of students; track $index) {

          <app-student-card
            [student]="student">
          </app-student-card>

        }

      </tbody>

    </table>

  } @else {

    <p>No students registered yet.</p>

  }

</div>
