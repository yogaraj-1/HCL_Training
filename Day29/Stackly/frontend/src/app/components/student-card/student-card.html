<td
  [ngClass]="{ 'hover-cell': isHovered }"
  (mouseenter)="isHovered = true"
  (mouseleave)="isHovered = false">
  {{ student().Name | uppercase }}
</td>

<td
  [ngClass]="{ 'hover-cell': isHovered }"
  (mouseenter)="isHovered = true"
  (mouseleave)="isHovered = false">
  {{ student().Age }}
</td>

<td
  [ngClass]="{ 'hover-cell': isHovered }"
  (mouseenter)="isHovered = true"
  (mouseleave)="isHovered = false">
  {{ student().Email }}
</td>

<td
  [ngClass]="{ 'hover-cell': isHovered }"
  (mouseenter)="isHovered = true"
  (mouseleave)="isHovered = false">
  {{ student().Course }}
</td>

<td
  [ngClass]="{ 'hover-cell': isHovered }"
  (mouseenter)="isHovered = true"
  (mouseleave)="isHovered = false">
  {{ student().Price | currency:'INR':'symbol':'1.0-0' }}
</td>

<td
  [ngClass]="{ 'hover-cell': isHovered }"
  (mouseenter)="isHovered = true"
  (mouseleave)="isHovered = false">
  {{ student().RegistrationDate | date:'dd-MM-yyyy' }}
</td>
