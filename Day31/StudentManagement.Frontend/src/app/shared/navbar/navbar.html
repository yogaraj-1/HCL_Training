<nav class="navbar">

  <div class="logo">
    Student Management
  </div>

  <div class="nav-links">

    @if (!loggedIn) {

      <a routerLink="/login">
        Login
      </a>

      <a routerLink="/register">
        Register
      </a>

    }

    @if (loggedIn && role === 'Student') {

      <a routerLink="/student/dashboard">
        Dashboard
      </a>

      <a routerLink="/student/profile">
        Profile
      </a>

      <button
        class="logout-button"
        (click)="logout()">
        Logout
      </button>

    }

    @if (loggedIn && role === 'Admin') {

      <a routerLink="/admin/dashboard">
        Admin Dashboard
      </a>

      <button
        class="logout-button"
        (click)="logout()">
        Logout
      </button>

    }

  </div>

</nav>
